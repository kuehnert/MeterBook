# MeterBook – Produktion. Feste Version (Tags siehe README).
# Update: Version erhöhen, dann "docker compose pull && docker compose up -d".
name: meterbook
services:
  meterbook:
    image: ghcr.io/kuehnert/meterbook:0.3.1
    container_name: meterbook
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      # Unter Windows (Docker Desktop) ist ein benanntes Volume robuster als ein Windows-Ordner,
      # siehe README "Daten-Ordner unter Windows": - meterbook-data:/data
      - ./data:/data
    environment:
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OCR_MODEL: ${OCR_MODEL:-claude-opus-5-5}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_TOKEN: ${BACKUP_TOKEN:-}
      PHOTO_RETENTION_DAYS: ${PHOTO_RETENTION_DAYS:-400}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
# volumes:
#   meterbook-data: {}
